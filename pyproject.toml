[project]
name = "mcp-case-tools"
version = "0.1.0"
description = "MCP server exposing case-management tools to AI assistants with RBAC scopes, transition rules, approvals and audit"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
